name: update-prices
on:
  schedule:
    - cron: '0 23 * * *'   # 06:00 น. เวลาไทย
  workflow_dispatch:       # ให้กดรันเองได้
permissions:
  contents: write
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install openai
      - run: python update_prices.py
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: apodex/apodex-1.1-mini:free
          # โมเดลสำรอง คั่นด้วย comma (ใส่ ID จริงจากหน้า openrouter.ai/models?pricing=free)
          # OPENROUTER_FALLBACKS: provider/model-b:free,provider/model-c:free
      - name: Commit prices.json
        run: |
          if [ ! -f prices.json ]; then
            echo "ไม่มี prices.json ข้ามขั้นตอน commit"
            exit 0
          fi
          git config user.name "price-bot"
          git config user.email "bot@users.noreply.github.com"
          git add prices.json
          git diff --cached --quiet || (git commit -m "update prices" && git push)
